# karmanto.com on our server: static files from CI (rsync to /var/www/karmanto.com), HTTPS from Let's Encrypt.
# Installed as /etc/nginx/conf.d/karmanto.com.conf next to fafn.ru.conf and isomantika.com.conf.
# www.karmanto.com, karmanto.ru and www.karmanto.ru redirect to https://karmanto.com. Setup steps — docs/hosting.md.

# Prerendered HTML is revalidated on every visit; hashed bundles never change; everything else — a week.
map $uri $karmanto_expires {
    default 7d;
    ~/$ -1;
    ~\.html$ -1;
    ~\.(xml|txt|webmanifest)$ 1h;
    "~-[A-Za-z0-9_-]{8}\.(js|css)$" max;
}

server {
    listen 80;
    server_name karmanto.com www.karmanto.com karmanto.ru www.karmanto.ru;

    return 301 https://karmanto.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.karmanto.com karmanto.ru www.karmanto.ru;

    ssl_certificate /etc/letsencrypt/live/karmanto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karmanto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://karmanto.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name karmanto.com;

    ssl_certificate /etc/letsencrypt/live/karmanto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karmanto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/karmanto.com;
    index index.html;

    # `/privacy` → `/privacy/` with a relative Location.
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    expires $karmanto_expires;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    # Unknown URLs get the 404 page of their locale.
    error_page 404 /404/index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /ru/ {
        error_page 404 /ru/404/index.html;
        try_files $uri $uri/ =404;
    }

    location /es/ {
        error_page 404 /es/404/index.html;
        try_files $uri $uri/ =404;
    }

    # Angular's client-only fallback page; every route is prerendered.
    location ~ /index\.csr\.html$ {
        return 404;
    }
}
