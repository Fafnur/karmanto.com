@if ($locale(); as locale) {
  <div
    class="fixed inset-x-4 bottom-4 z-30 mx-auto flex max-w-md items-center gap-3 rounded-card border border-outline bg-paper px-4 py-3 shadow-paper"
    [attr.lang]="locale.id"
  >
    <img class="h-3 w-4 rounded-sm object-cover" [src]="locale.flag" alt="" width="16" height="12" />
    <a class="flex-1 font-semibold" [href]="$href()" [attr.hreflang]="locale.id">{{ locale.hint }}</a>
    <button
      type="button"
      class="flex h-8 w-8 items-center justify-center rounded-full text-ink-muted hover:bg-background hover:text-ink"
      [attr.aria-label]="locale.hintClose"
      (click)="onClose()"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
}
