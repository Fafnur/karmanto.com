<div class="mx-auto w-72 rounded-[2.5rem] border-[10px] border-outline bg-background p-4 shadow-paper sm:w-80">
  <div class="mx-auto mb-4 h-1.5 w-16 rounded-full bg-outline" aria-hidden="true"></div>
  <div class="flex items-baseline justify-between px-1 text-sm">
    <span class="font-semibold" i18n="Home page|Phone demo: screen title, the Study tab of the app">Study</span>
    <span class="text-ink-muted">{{ $index() + 1 }} / {{ cards.length }}</span>
  </div>

  <div class="mt-3" aria-live="polite">
    @for (card of $current(); track card.term) {
      <button type="button" class="block h-64 w-full rounded-card text-left [perspective:1000px]" (click)="onFlip()">
        <span
          class="relative block h-full w-full motion-safe:transition-transform motion-safe:duration-500 [transform-style:preserve-3d] [&.is-flipped]:[transform:rotateY(180deg)]"
          [class.is-flipped]="$flipped()"
        >
          <span
            class="absolute inset-0 flex flex-col items-center justify-center rounded-card border border-outline bg-paper p-5 text-center shadow-paper [backface-visibility:hidden]"
            [attr.aria-hidden]="$flipped()"
          >
            <span class="block text-3xl font-bold" [lang]="card.lang">{{ card.term }}</span>
            @if (card.transcription; as transcription) {
              <span class="mt-2 block text-ink-muted">[{{ transcription }}]</span>
            }
            <span
              class="absolute inset-x-0 bottom-4 block text-sm text-ink-muted"
              i18n="Home page|Phone demo: hint on the card, as in the app"
              >Tap to flip</span
            >
          </span>
          <span
            class="absolute inset-0 flex flex-col items-center justify-center rounded-card border border-outline bg-paper p-5 text-center shadow-paper [backface-visibility:hidden] [transform:rotateY(180deg)]"
            [attr.aria-hidden]="!$flipped()"
          >
            <span class="block text-sm text-ink-muted" [lang]="card.lang">{{ card.term }}</span>
            <span class="mt-2 block text-3xl font-bold">{{ card.translation }}</span>
            <span class="mt-2 block text-sm text-ink-secondary">{{ partsOfSpeech[card.partOfSpeech] }}</span>
            <span class="mt-4 block italic text-ink-secondary" [lang]="card.lang">{{ card.example }}</span>
          </span>
        </span>
      </button>
    }
  </div>

  <div class="mt-4 grid grid-cols-2 gap-3">
    <button
      type="button"
      class="h-12 rounded-button border-[1.5px] border-again px-2 font-semibold text-again transition-colors hover:bg-again/10"
      (click)="onAnswer()"
      i18n="Home page|Phone demo: answer button, as in the app"
    >
      Don't know
    </button>
    <button
      type="button"
      class="h-12 rounded-button border-[1.5px] border-know px-2 font-semibold text-know transition-colors hover:bg-know/10"
      (click)="onAnswer()"
      i18n="Home page|Phone demo: answer button, as in the app"
    >
      I know
    </button>
  </div>
</div>
